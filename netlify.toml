[build]
  command = "npm test && npm run build"
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[functions."sync"]
  schedule = "*/15 * * * *"
[functions."refresh-players"]
  schedule = "0 11 * * *"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
